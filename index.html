<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drill 2</title>
     <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" >
      <style>

    body {
        display: flex;
        align-items: center;
        flex-direction: column;
        min-height: 100vh;
        margin: 0;
    }

    h1 {
        font-style: italic;
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
    }

    .menu {
        text-align: left;
    }
   
    form {
        background-color: #abc7bf;
        width: 500px;
        padding: 35px 45px;
        border-radius: 30px;
        box-shadow: 0 10px 30px rgba(80, 60, 40, 0.18);
    }

    label {
        font-size: 24px;
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        color: #ffe6d5;
    }

    input {
        accent-color: #8B6848;
    }

    button {
        background-color: #8B6848;
        color: white;
        border: none;
        border-radius: 20px;
        padding: 10px 25px;
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        font-size: 16px;
        cursor: pointer;
        box-shadow: 0 5px 12px rgba(80, 60, 40, 0.18);
    }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-lg-7">
                <h1>New Rainbow Catering Members (Late Passers)</h1>
                <form action="">
                    <input type="text" id="input1" placeholder="Enter first name here.">
                    <input type="text" id="input1" placeholder="Enter last name here.">
                    <br>
                    <button type="button" id="btn" class="btn btn-secondary" py-click="add_member">enter</button>
                </form>
            </div>
        </div>

        <div class="row">
             <div class="col-lg-7" id="output1">

             </div>
        </div>
    </div>
    <script type="py" src="main.py"></script>
</body>
</html>
